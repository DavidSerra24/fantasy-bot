name: Diagnosi
on:
  workflow_dispatch:
    inputs:
      module:
        default: "bot.p11debug"
jobs:
  dbg:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m ${{ github.event.inputs.module }}
        env:
          SI_EMAIL: ${{ secrets.SI_EMAIL }}
          SI_PASSWORD: ${{ secrets.SI_PASSWORD }}
          FF_EMAIL: ${{ secrets.FF_EMAIL }}
          FF_PASSWORD: ${{ secrets.FF_PASSWORD }}
          MISTER_EMAIL: ${{ secrets.MISTER_EMAIL }}
          MISTER_PASSWORD: ${{ secrets.MISTER_PASSWORD }}
