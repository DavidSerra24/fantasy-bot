name: Predicted11
on:
  schedule:
    # Hores en UTC (Madrid = UTC+2 a l'estiu, UTC+1 a l'hivern)
    - cron: "10 7 * * *"
    - cron: "10 13 * * *"
  workflow_dispatch:
    inputs:
      comps:
        description: "Competicions (laliga laliga2 premier-league serie-a champions)"
        default: "laliga laliga2 premier-league serie-a champions"
      force:
        description: "Forçar encara que falti molt per tancar (true/false)"
        default: "false"
concurrency: predicted11
jobs:
  p11:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: state-p11-${{ github.run_id }}
          restore-keys: state-p11-
      - name: Omplir Predicted11
        run: |
          ARGS="${{ github.event.inputs.comps || 'laliga laliga2 premier-league serie-a champions' }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m bot.p11 $ARGS
        env:
          SI_EMAIL: ${{ secrets.SI_EMAIL }}
          SI_PASSWORD: ${{ secrets.SI_PASSWORD }}
          FF_EMAIL: ${{ secrets.FF_EMAIL }}
          FF_PASSWORD: ${{ secrets.FF_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: state-p11-${{ github.run_id }}
