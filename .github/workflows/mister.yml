name: Mister (manual)
on:
  workflow_dispatch:
    inputs:
      modul:
        description: "bot.mistermarket o bot.misteroffers"
        default: "bot.mistermarket"
      args:
        description: "Opcions (p. ex. --dry)"
        default: ""
concurrency: mister
jobs:
  mister:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SI_EMAIL: ${{ secrets.SI_EMAIL }}
      SI_PASSWORD: ${{ secrets.SI_PASSWORD }}
      FF_EMAIL: ${{ secrets.FF_EMAIL }}
      FF_PASSWORD: ${{ secrets.FF_PASSWORD }}
      MISTER_EMAIL: ${{ secrets.MISTER_EMAIL }}
      MISTER_PASSWORD: ${{ secrets.MISTER_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: (python -m playwright install --with-deps chromium || python -m playwright install --with-deps chromium || python -m playwright install chromium)
      - uses: actions/cache/restore@v4
        with:
          path: |
            state
            !state/session_*.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: mkdir -p state && sleep 1 && touch .state_start
      - run: python -m ${{ github.event.inputs.modul }} ${{ github.event.inputs.args }}
      - name: Fusionar l'estat amb el més recent (13/11, cursa entre execucions)
        if: always()
        run: rm -rf .state_mine && mv state .state_mine && mkdir -p state
      - uses: actions/cache/restore@v4
        if: always()
        with:
          path: |
            state
            !state/session_*.json
          key: state-merge-${{ github.run_id }}
          restore-keys: state-
      - if: always()
        run: |  # només els fitxers que aquesta execució ha canviat trepitgen l'estat més recent
          cd .state_mine && find . -type f -newer ../.state_start -exec cp --parents {} ../state/ \; && cd .. && ls state | wc -l
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state
            !state/session_*.json
          key: state-${{ github.run_id }}
