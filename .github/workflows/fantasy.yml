name: Fantasy (manual)
on:
  workflow_dispatch:
    inputs:
      what:
        description: "Què fer: p11, ff o tot"
        default: "tot"
      comps:
        description: "Predicted11: competicions"
        default: "laliga laliga2 premier-league serie-a champions"
      force:
        description: "Predicted11: forçar encara que falti molt (true/false)"
        default: "false"
      ffargs:
        description: "FutbolFantasy: opcions (p.ex. --dry --max-hours 40)"
        default: ""
concurrency: fantasy
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SI_EMAIL: ${{ secrets.SI_EMAIL }}
      SI_PASSWORD: ${{ secrets.SI_PASSWORD }}
      FF_EMAIL: ${{ secrets.FF_EMAIL }}
      FF_PASSWORD: ${{ secrets.FF_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WHAT: ${{ github.event.inputs.what || 'tot' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: (python -m playwright install --with-deps chromium || python -m playwright install --with-deps chromium || python -m playwright install chromium)
      - uses: actions/cache/restore@v4
        with:
          path: |
            state
            !state/session_*.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: mkdir -p state && sleep 1 && touch .state_start
      - name: Predicted11
        if: env.WHAT == 'tot' || env.WHAT == 'p11'
        continue-on-error: true
        run: |
          ARGS="${{ github.event.inputs.comps || 'laliga laliga2 premier-league serie-a champions' }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m bot.p11 $ARGS
      - name: FutbolFantasy
        if: env.WHAT == 'tot' || env.WHAT == 'ff'
        continue-on-error: true
        run: python -m bot.ff ${{ github.event.inputs.ffargs }}
      - name: Fusionar l'estat amb el més recent (13/11, cursa entre execucions)
        if: always()
        run: rm -rf .state_mine && mv state .state_mine && mkdir -p state
      - uses: actions/cache/restore@v4
        if: always()
        with:
          path: |
            state
            !state/session_*.json
          key: state-merge-${{ github.run_id }}
          restore-keys: state-
      - if: always()
        run: |  # només els fitxers que aquesta execució ha canviat trepitgen l'estat més recent
          cd .state_mine && find . -type f -newer ../.state_start -exec cp --parents {} ../state/ \; && cd .. && ls state | wc -l
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state
            !state/session_*.json
          key: state-${{ github.run_id }}
