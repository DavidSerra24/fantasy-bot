name: Automàtic (cada 30 min)
on:
  schedule:
    # Cada 30 minuts, tot el dia (el repositori és públic: les execucions no tenen cost). GitHub sovint només
    # n'arrenca una per hora i amb retard: el planificador agafa les accions dels propers 90 min.
    - cron: "5,35 * * * *"
  workflow_dispatch:
concurrency: fantasy
jobs:
  auto:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SI_EMAIL: ${{ secrets.SI_EMAIL }}
      SI_PASSWORD: ${{ secrets.SI_PASSWORD }}
      FF_EMAIL: ${{ secrets.FF_EMAIL }}
      FF_PASSWORD: ${{ secrets.FF_PASSWORD }}
      MISTER_EMAIL: ${{ secrets.MISTER_EMAIL }}
      MISTER_PASSWORD: ${{ secrets.MISTER_PASSWORD }}
      SORARE_EMAIL: ${{ secrets.SORARE_EMAIL }}
      SORARE_PASSWORD: ${{ secrets.SORARE_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: |
            state
            !state/session_*.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: pip install requests python-dotenv
      - name: Planificar
        id: plan
        run: python -m bot.plan
      - name: Preparar navegador
        if: steps.plan.outputs.has == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Executar
        if: steps.plan.outputs.has == 'true'
        run: python -m bot.execute
      - uses: actions/cache/save@v4
        if: always() && steps.plan.outputs.has == 'true'
        with:
          path: |
            state
            !state/session_*.json
          key: state-${{ github.run_id }}
