name: Sorare (manual)
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "login (entrar; et demanarà el codi per Telegram) o me (comprovar)"
        default: "login"
concurrency: sorare
jobs:
  sorare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120  # arenasgo i gkretry esperen fins a l'hora d'enviar l'Arena (7/11: es va tallar als 20 min)
    env:
      SORARE_EMAIL: ${{ secrets.SORARE_EMAIL }}
      SORARE_PASSWORD: ${{ secrets.SORARE_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TG_IMG_DIR: tgimg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests python-dotenv bcrypt cryptography
      - run: |  # imatges per a Telegram (bot/tgimg.py, 11/11)
          pip install playwright
          (python -m playwright install --with-deps chromium || python -m playwright install --with-deps chromium || python -m playwright install chromium)
      - uses: actions/cache/restore@v4
        with:
          path: |
            state
            !state/session_*.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: mkdir -p state && sleep 1 && touch .state_start
      - run: python -m bot.sorare ${{ github.event.inputs.cmd }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tgimg
          path: tgimg
          if-no-files-found: ignore
      - name: Fusionar l'estat amb el més recent (13/11, cursa entre execucions)
        if: always()
        run: rm -rf .state_mine && mv state .state_mine && mkdir -p state
      - uses: actions/cache/restore@v4
        if: always()
        with:
          path: |
            state
            !state/session_*.json
          key: state-merge-${{ github.run_id }}
          restore-keys: state-
      - if: always()
        run: |  # només els fitxers que aquesta execució ha canviat trepitgen l'estat més recent
          cd .state_mine && find . -type f -newer ../.state_start -exec cp --parents {} ../state/ \; && cd .. && ls state | wc -l
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state
            !state/session_*.json
          key: state-${{ github.run_id }}
